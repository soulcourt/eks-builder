[package]
name = "eks_builder"
version = "0.1.0"
edition = "2024"

[lib]
name = "eks_builder"
path = "src/lib.rs"

[[bin]]
name = "eks-builder"
path = "src/main.rs"

[dependencies]
log = "0.4.27"
env_logger = "0.11.8"
figment = { version = "0.10.19", features = ["toml"] }
toml = "0.9.11"
uuid = { version = "1", features = ["v4"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
image = "0.25.9"
clap = { version = "4.5.54", features = ["derive"] }
tiny_http = "0.12.0"
url = "2.5.8"
